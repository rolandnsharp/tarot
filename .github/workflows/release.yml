name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install audio dependencies (Linux amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cross-compile dependencies (Linux arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # Add arm64 ports and pin existing sources to amd64
          sudo dpkg --add-architecture arm64
          # Ubuntu 24.04 uses DEB822 .sources format — add Architectures field
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/\nSuites: %s %s-updates\nComponents: main restricted universe\nArchitectures: arm64\n' \
            "$(lsb_release -cs)" "$(lsb_release -cs)" | sudo tee /etc/apt/sources.list.d/arm64-ports.sources
          sudo apt-get update
          sudo apt-get install -y libasound2-dev:arm64

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
          CC: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -o "tarot${EXT}" .

      - name: Package
        run: |
          ARCHIVE="tarot-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir "$ARCHIVE"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp tarot.exe "$ARCHIVE/"
          else
            cp tarot "$ARCHIVE/"
          fi
          cp README.md tarot.md "$ARCHIVE/"
          cp -r decks "$ARCHIVE/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "$ARCHIVE.zip" "$ARCHIVE"
          else
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tarot-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tarot-*.tar.gz
            tarot-*.zip
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | Linux (x86_64) | `tarot-linux-amd64.tar.gz` |
            | Linux (ARM64, e.g. Raspberry Pi) | `tarot-linux-arm64.tar.gz` |
            | macOS (Apple Silicon) | `tarot-darwin-arm64.tar.gz` |
            | macOS (Intel) | `tarot-darwin-amd64.tar.gz` |
            | Windows (x86_64) | `tarot-windows-amd64.zip` |
            | Windows (ARM64) | `tarot-windows-arm64.zip` |

            **Linux / macOS:**
            ```bash
            tar xzf tarot-*.tar.gz
            cd tarot-*/
            ./tarot
            ```

            **Windows:** Extract the zip, then run `tarot.exe` from the extracted folder.

            Requires [Ollama](https://ollama.com) for AI readings. See the README for setup.
