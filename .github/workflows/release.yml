name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o tarot .

      - name: Package
        run: |
          ARCHIVE="tarot-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir "$ARCHIVE"
          cp tarot README.md tarot.md "$ARCHIVE/"
          cp -r decks sounds music "$ARCHIVE/"
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: tarot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tarot-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: tarot-*.tar.gz
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | Linux (x86_64) | `tarot-linux-amd64.tar.gz` |
            | Linux (ARM64, e.g. Raspberry Pi) | `tarot-linux-arm64.tar.gz` |
            | macOS (Apple Silicon) | `tarot-darwin-arm64.tar.gz` |
            | macOS (Intel) | `tarot-darwin-amd64.tar.gz` |

            ```bash
            tar xzf tarot-*.tar.gz
            cd tarot-*/
            ./tarot
            ```

            Requires [Ollama](https://ollama.com) for AI readings. See the README for setup.
